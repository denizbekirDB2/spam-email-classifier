<!DOCTYPE html>
<html>
    <head>
        <title>Spam Email Classifier</title>
        <style>
            #main {
                width: 300px;
                margin-left: auto;
                margin-right: auto;
            }
            textarea {
                resize: none;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <h1>Enter you mail below</h1>
            <form id="myForm">
            <textarea id="email" name="email" cols="40" rows="8"></textarea>
            <div>
                <input type="submit" value="Submit">
                <label>Result: </label>
                <label id="result"></label>
            </div>
            </form>
        </div>

    </body>
    <script>
    document.getElementById("myForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
        email: document.getElementById("email").value
        };

        const response = await fetch("/classification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
        });

        const json = await response.json();
        document.getElementById("result").textContent = json.data;
    });
    </script>
</html>
